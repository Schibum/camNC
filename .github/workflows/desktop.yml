name: Desktop app
permissions:
  contents: write

# Builds the Tauri desktop app (apps/camnc-desktop) for macOS and Windows. Pull requests that touch it get unsigned
# build artifacts; a `desktop-v*` tag creates a draft GitHub release with the installers.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    branches:
      - main
    paths:
      - "apps/camnc-desktop/**"
      - "apps/camNC/src/lib/desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/camnc-desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Download go2rtc
        run: node apps/camnc-desktop/scripts/fetch-go2rtc.mjs ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/camnc-desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: camNC desktop ${{ github.ref_name }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: camnc-desktop-${{ matrix.target }}
          path: |
            apps/camnc-desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/camnc-desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/camnc-desktop/src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error
