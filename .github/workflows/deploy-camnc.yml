name: Deploy camNC

# Deploys apps/camNC (static SPA + settings API Worker + D1) to Cloudflare Workers.
# PRs get a preview version at https://pr-<number>-camnc-preview.<subdomain>.workers.dev.
# Needs the CLOUDFLARE_API_TOKEN secret plus CAMNC_CLERK_PUBLISHABLE_KEY and
# CAMNC_PREVIEW_CLERK_PUBLISHABLE_KEY variables; skipped until CLOUDFLARE_API_TOKEN is set.

on:
  push:
    branches:
      - main
    paths:
      - apps/camNC/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-camnc.yml
  pull_request:
    paths:
      - apps/camNC/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-camnc.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-camnc-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    # Fork PRs get no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IS_PREVIEW: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.HAS_TOKEN == 'true'
      - name: Build
        if: env.HAS_TOKEN == 'true'
        run: pnpm turbo run build --filter @wbcnc/camNC
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ env.IS_PREVIEW == 'true' && vars.CAMNC_PREVIEW_CLERK_PUBLISHABLE_KEY || vars.CAMNC_CLERK_PUBLISHABLE_KEY }}
      - name: Deploy production
        if: env.HAS_TOKEN == 'true' && env.IS_PREVIEW != 'true'
        working-directory: apps/camNC
        run: pnpm run deploy
      - name: Upload preview
        id: preview
        if: env.HAS_TOKEN == 'true' && env.IS_PREVIEW == 'true'
        working-directory: apps/camNC
        run: |
          pnpm run deploy:preview --preview-alias pr-${{ github.event.number }} | tee upload.log
          url=$(grep -oE 'https://pr-${{ github.event.number }}-[a-z0-9.-]+\.workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- camnc-preview -->';
            const body = `${marker}\ncamNC preview: ${{ steps.preview.outputs.url }} (commit ${context.sha.slice(0, 7)})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
