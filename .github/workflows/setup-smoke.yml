name: Production setup smoke

on:
  # Vercel reports a deployment status for every deployment; the job below only runs for successful
  # production deployments of the camNC app, i.e. after main has been deployed.
  deployment_status:
  pull_request:
    paths:
      - apps/camNC/e2e/**
      - .github/workflows/setup-smoke.yml
  workflow_dispatch:
    inputs:
      base_url:
        description: camNC deployment URL
        type: string
        required: true
        default: https://run.camnc.app/

permissions:
  contents: read

jobs:
  setup-smoke:
    # Vercel names environments e.g. "Production – camnc" (other projects: "Production – camnc-demos", ...).
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment_status.environment, 'Production') &&
      endsWith(github.event.deployment_status.environment, ' camnc'))
    # Job level (not workflow level), so that skipped runs for the other Vercel projects, whose deployment
    # statuses arrive seconds later, don't cancel the camNC smoke run.
    concurrency:
      group: setup-smoke-${{ github.event_name == 'deployment_status' && 'production' || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify deployed setup
        run: pnpm --filter @wbcnc/camNC smoke:setup
        env:
          CAMNC_SMOKE_URL: ${{ inputs.base_url || 'https://run.camnc.app/' }}
      - name: Upload smoke report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-smoke
          path: output/playwright/setup-smoke/
          if-no-files-found: warn
          retention-days: 7
