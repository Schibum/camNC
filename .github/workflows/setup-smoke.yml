name: Production setup smoke

on:
  # After Cloudflare Workers Builds reports a successful build of the camnc Worker (production) on main.
  check_run:
    types: [completed]
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    paths:
      - apps/camNC/e2e/**
      - .github/workflows/setup-smoke.yml
  workflow_dispatch:
    inputs:
      base_url:
        description: camNC deployment URL
        type: string
        required: true
        default: https://run.camnc.app/

permissions:
  contents: read

jobs:
  setup-smoke:
    if: >-
      github.event_name != 'check_run' ||
      (github.event.check_run.conclusion == 'success' &&
      github.event.check_run.check_suite.head_branch == 'main' &&
      contains(github.event.check_run.name, 'camnc') &&
      !contains(github.event.check_run.name, 'preview'))
    # Job level (not workflow level), so that skipped runs don't cancel a running smoke run.
    concurrency:
      group: setup-smoke-${{ (github.event_name == 'check_run' || github.event_name == 'schedule') && 'production' || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify deployed setup
        run: pnpm --filter @wbcnc/camNC smoke:setup
        env:
          CAMNC_SMOKE_URL: ${{ inputs.base_url || 'https://run.camnc.app/' }}
      - name: Upload smoke report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-smoke
          path: output/playwright/setup-smoke/
          if-no-files-found: warn
          retention-days: 7
